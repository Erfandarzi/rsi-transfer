name: tests
on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # Tests that need the pinned upstreams fetch them; the rest run offline.
      - run: ./experiments/ablation/setup.sh
      - run: python experiments/ablation/make_arms.py
      - run: pytest -q
      - run: ruff check src analysis tests
