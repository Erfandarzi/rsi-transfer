[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi-transfer"
version = "0.1.0"
description = "Do self-generated improvements to AI agents survive a change of base model?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Erfan Darzi" }]
keywords = ["recursive self-improvement", "agent harness", "transfer", "evaluation"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

# Selected explicitly rather than left to the default, which changes between ruff
# releases -- CI installs the newest and would otherwise disagree with a local run.
[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# Analysis scripts extend sys.path before importing the package, so imports cannot all
# sit at the top of the file.
ignore = ["E402"]
